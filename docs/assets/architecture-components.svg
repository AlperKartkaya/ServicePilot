<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="740" viewBox="0 0 1140 740" role="img" aria-labelledby="title desc">
<title id="title">Bir vakanın arkasındaki parçalar</title><desc id="desc">Yerel FastAPI yolu: servis ekranı vakayı iletir, FastAPI adımları koordine eder ve SQLite kaydını yönetir. Jev olasılık sinyalleri üretir; RAEP bu sinyallerle sıradaki işlemi seçer. Ortak katalog uzmanlıkları, kanıtları, güvenlik kurallarını ve ayarları sağlar. Demo senaryoları FastAPI tarafından açılır.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 8 5 2 9" fill="none" stroke="#8a9d93" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1140" height="740" rx="20" fill="#faf9f5"/>
<g font-family="Avenir Next, Arial, sans-serif">
<text x="48" y="57" fill="#273f39" font-size="32" font-weight="600"><tspan x="48" dy="0">Bir vakanın arkasındaki parçalar</tspan></text>
<text x="48" y="93" fill="#52645d" font-size="20" font-weight="400"><tspan x="48" dy="0">Jev anlamlandırır. RAEP sıradaki işlemi seçer. İnsan son kararı verir.</tspan></text>
<path d="M325 230H425" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="342" y="217" fill="#52645d" font-size="16" font-weight="400"><tspan x="342" dy="0">vaka</tspan></text>
