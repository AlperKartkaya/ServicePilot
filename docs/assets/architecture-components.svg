<text x="829" y="197" fill="#273f39" font-size="23" font-weight="600"><tspan x="829" dy="0">Vaka kaydı</tspan></text>
<text x="829" y="234" fill="#273f39" font-size="19" font-weight="400"><tspan x="829" dy="0">Vaka geçmişi ve</tspan><tspan x="829" dy="27.55">politika ayarları.</tspan></text>
<text x="829" y="284" fill="#52645d" font-size="14" font-weight="400"><tspan x="829" dy="0">app/store.py · SQLite</tspan></text>
