<text x="449" y="462" fill="#285e50" font-size="19" font-weight="400"><tspan x="449" dy="0">Vakanın anlamından</tspan><tspan x="449" dy="27.55">olasılık sinyalleri çıkarır.</tspan></text>
<text x="449" y="531" fill="#52645d" font-size="14" font-weight="400"><tspan x="449" dy="0">app/jev.py</tspan></text>
<rect x="805" y="386" width="287" height="164" rx="14" fill="#dcebe3"/>
<text x="829" y="425" fill="#285e50" font-size="23" font-weight="600"><tspan x="829" dy="0">RAEP</tspan></text>
<text x="829" y="462" fill="#285e50" font-size="19" font-weight="400"><tspan x="829" dy="0">Risk ve kanıt maliyetiyle</tspan><tspan x="829" dy="27.55">sıradaki işlemi seçer.</tspan></text>
<text x="829" y="531" fill="#52645d" font-size="14" font-weight="400"><tspan x="829" dy="0">app/raep.py</tspan></text>
<text x="48" y="674" fill="#273f39" font-size="20" font-weight="600"><tspan x="48" dy="0">Demo ve replay vakaları</tspan></text>
<text x="338" y="674" fill="#52645d" font-size="18" font-weight="400"><tspan x="338" dy="0">app/scenarios.py → FastAPI</tspan></text>
<text x="48" y="709" fill="#52645d" font-size="16" font-weight="400"><tspan x="48" dy="0">Yerel çalışma yolu gösterilir. GitHub Pages + Worker yolu mimari belgesinde ayrıca açıklanır.</tspan></text>
