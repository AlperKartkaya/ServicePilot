<text x="738" y="198" fill="#52645d" font-size="15" font-weight="400"><tspan x="738" dy="0">oku /</tspan><tspan x="738" dy="20">kaydet</tspan></text>
<path d="M570 315V386" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="589" y="358" fill="#52645d" font-size="16" font-weight="400"><tspan x="589" dy="0">değerlendir</tspan></text>
<path d="M715 472H805" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="738" y="455" fill="#52645d" font-size="16" font-weight="400"><tspan x="738" dy="0">sinyal</tspan></text>
<path d="M325 472H425" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M325 507V605Q325 619 340 619H940Q955 619 955 605V550" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="158" width="277" height="145" rx="14" fill="#efede7"/>
<text x="72" y="197" fill="#273f39" font-size="23" font-weight="600"><tspan x="72" dy="0">Servis ekranı</tspan></text>
<text x="72" y="234" fill="#273f39" font-size="19" font-weight="400"><tspan x="72" dy="0">Teknisyen notu, araç</tspan><tspan x="72" dy="27.55">bilgisi ve kanıtlar.</tspan></text>
<text x="72" y="284" fill="#52645d" font-size="14" font-weight="400"><tspan x="72" dy="0">static/demo/ · app.js</tspan></text>
<rect x="425" y="158" width="290" height="157" rx="14" fill="#dcebe3"/>
<text x="449" y="197" fill="#285e50" font-size="23" font-weight="600"><tspan x="449" dy="0">Vaka koordinasyonu</tspan></text>
<text x="449" y="234" fill="#285e50" font-size="19" font-weight="400"><tspan x="449" dy="0">İstekleri ve vaka</tspan><tspan x="449" dy="27.55">adımlarını yönetir.</tspan></text>
<text x="449" y="296" fill="#52645d" font-size="14" font-weight="400"><tspan x="449" dy="0">app/main.py</tspan></text>
