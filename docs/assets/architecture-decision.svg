<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1295" viewBox="0 0 1200 1295" role="img" aria-labelledby="title desc">
<title id="title">Bir sonraki adım nasıl seçilir?</title><desc id="desc">Vaka önce açık güvenlik riskine göre kontrol edilir. Risk yoksa Jev sinyalleri alınır. RAEP kritik riskte veya Jev yanıtı yoksa insan uzmana eskale eder. Yeterince net uzmanlık ve bilgi varsa ekip önerir. Değilse yararlı ve maliyetine değen kanıtı, istek hakkı varsa ister. Kanıt sonrası aynı döngü tekrarlanır. Ek kanıt seçilemiyorsa güvenilen uzmanlık veya üst grup önerilir; bu da yoksa insan uzman devreye girer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1 8 5 2 9" fill="none" stroke="#8a9d93" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
<rect width="1200" height="1295" rx="20" fill="#faf9f5"/>
<g font-family="Avenir Next, Arial, sans-serif">
<text x="48" y="58" fill="#273f39" font-size="34" font-weight="600"><tspan x="48" dy="0">Bir sonraki adım nasıl seçilir?</tspan></text>
<text x="48" y="97" fill="#52645d" font-size="21" font-weight="400"><tspan x="48" dy="0">Her kontrolde tek soru. Sonunda uygulanabilir bir işlem.</tspan></text>
<path d="M310 210H415" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M755 210H875" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="795" y="196" fill="#a44934" font-size="18" font-weight="600"><tspan x="795" dy="0">Evet</tspan></text>
<path d="M585 279V345" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="606" y="321" fill="#52645d" font-size="17" font-weight="400"><tspan x="606" dy="0">Hayır</tspan></text>
<path d="M755 416Q775 400 795 400H875" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="777" y="365" fill="#a44934" font-size="16" font-weight="400"><tspan x="777" dy="0">RAEP: risk</tspan><tspan x="777" dy="22">veya kesinti</tspan></text>
<path d="M585 495V560" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="607" y="537" fill="#52645d" font-size="17" font-weight="400"><tspan x="607" dy="0">Güvenli sinyaller</tspan></text>
<path d="M755 629H875" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="793" y="615" fill="#285e50" font-size="18" font-weight="600"><tspan x="793" dy="0">Evet</tspan></text>
<path d="M585 698V760" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="606" y="738" fill="#52645d" font-size="17" font-weight="400"><tspan x="606" dy="0">Hayır</tspan></text>
<path d="M415 837H310" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="342" y="824" fill="#285e50" font-size="18" font-weight="600"><tspan x="342" dy="0">Evet</tspan></text>
<path d="M585 915V975" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="606" y="952" fill="#52645d" font-size="17" font-weight="400"><tspan x="606" dy="0">Hayır</tspan></text>
<path d="M755 1044H875" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="793" y="1030" fill="#285e50" font-size="18" font-weight="600"><tspan x="793" dy="0">Evet</tspan></text>
<path d="M585 1112V1163" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="606" y="1148" fill="#52645d" font-size="17" font-weight="400"><tspan x="606" dy="0">Hayır</tspan></text>
<path d="M185 915V948Q185 965 165 965H34Q20 965 20 945V210Q20 190 40 190H60" fill="none" stroke="#8a9d93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="60" y="150" width="250" height="120" rx="14" fill="#efede7"/>
<text x="84" y="189" fill="#273f39" font-size="23" font-weight="600"><tspan x="84" dy="0">Vaka gelir</tspan></text>
<text x="84" y="226" fill="#273f39" font-size="19" font-weight="400"><tspan x="84" dy="0">Not, araç, geçmiş</tspan><tspan x="84" dy="27.55">ve mevcut kanıtlar.</tspan></text>
<rect x="415" y="150" width="340" height="129" rx="14" fill="#f3e7d4"/>
<text x="439" y="189" fill="#273f39" font-size="23" font-weight="600"><tspan x="439" dy="0">Açık tehlike var mı?</tspan></text>
<text x="439" y="226" fill="#273f39" font-size="19" font-weight="400"><tspan x="439" dy="0">Önce güvenlik kuralları</tspan><tspan x="439" dy="27.55">kontrol edilir.</tspan></text>
<rect x="875" y="150" width="265" height="274" rx="14" fill="#f6e2da"/>
<text x="899" y="189" fill="#a44934" font-size="23" font-weight="600"><tspan x="899" dy="0">İnsan uzman</tspan></text>
<text x="899" y="226" fill="#a44934" font-size="19" font-weight="400"><tspan x="899" dy="0">Tehlikede Jev beklenmez.</tspan><tspan x="899" dy="27.55"></tspan><tspan x="899" dy="27.55">RAEP, kritik sinyalde veya</tspan><tspan x="899" dy="27.55">Jev yanıtı alınamadığında</tspan><tspan x="899" dy="27.55">insan uzmanı devreye alır.</tspan></text>
<rect x="415" y="345" width="340" height="150" rx="14" fill="#dcebe3"/>
<text x="439" y="384" fill="#285e50" font-size="23" font-weight="600"><tspan x="439" dy="0">Jev sinyal üretir</tspan></text>
<text x="439" y="421" fill="#285e50" font-size="19" font-weight="400"><tspan x="439" dy="0">Hangi uzmanlık? Bilgi yeterli mi?</tspan><tspan x="439" dy="27.55">Risk ve mevcut kanıtlar ne?</tspan></text>
<text x="439" y="476" fill="#52645d" font-size="14" font-weight="400"><tspan x="439" dy="0">Jev sinyali → RAEP kontrolü</tspan></text>
<rect x="415" y="560" width="340" height="138" rx="14" fill="#edf2ed"/>
<text x="439" y="599" fill="#273f39" font-size="23" font-weight="600"><tspan x="439" dy="0">Vaka yeterince net mi?</tspan></text>
<text x="439" y="636" fill="#273f39" font-size="19" font-weight="400"><tspan x="439" dy="0">Uzmanlık olasılığı ve bilgi</tspan><tspan x="439" dy="27.55">yeterliliği eşikleri sağlanır mı?</tspan></text>
<rect x="875" y="560" width="265" height="160" rx="14" fill="#dcebe3"/>
<text x="899" y="599" fill="#285e50" font-size="23" font-weight="600"><tspan x="899" dy="0">Uzman ekibe hazırla</tspan></text>
<text x="899" y="636" fill="#285e50" font-size="19" font-weight="400"><tspan x="899" dy="0">Vaka, kanıt ve gerekçe</tspan><tspan x="899" dy="27.55">birlikte sunulur.</tspan></text>
<text x="899" y="701" fill="#52645d" font-size="14" font-weight="400"><tspan x="899" dy="0">İnsan onaylar veya değiştirir.</tspan></text>
<rect x="415" y="760" width="340" height="155" rx="14" fill="#f3e7d4"/>
<text x="439" y="799" fill="#273f39" font-size="23" font-weight="600"><tspan x="439" dy="0">Ek kanıt işe yarar mı?</tspan></text>
<text x="439" y="836" fill="#273f39" font-size="19" font-weight="400"><tspan x="439" dy="0">Kararı iyileştirir mi?</tspan><tspan x="439" dy="27.55">Maliyetine değer mi?</tspan><tspan x="439" dy="27.55">İstek hakkı kaldı mı?</tspan></text>
<rect x="60" y="760" width="250" height="155" rx="14" fill="#f3e7d4"/>
<text x="84" y="799" fill="#273f39" font-size="23" font-weight="600"><tspan x="84" dy="0">Bir kanıt daha iste</tspan></text>
<text x="84" y="836" fill="#273f39" font-size="19" font-weight="400"><tspan x="84" dy="0">En yararlı kontrolü seç.</tspan><tspan x="84" dy="27.55">Sonuç gelince vakayı</tspan><tspan x="84" dy="27.55">yeniden değerlendir.</tspan></text>
<rect x="415" y="975" width="340" height="137" rx="14" fill="#edf2ed"/>
<text x="439" y="1014" fill="#273f39" font-size="23" font-weight="600"><tspan x="439" dy="0">Güvenilen bir ekip var mı?</tspan></text>
<text x="439" y="1051" fill="#273f39" font-size="19" font-weight="400"><tspan x="439" dy="0">Uzmanlık seçilebiliyor mu?</tspan><tspan x="439" dy="27.55">Gerekirse üst gruba çıkılır.</tspan></text>
<rect x="875" y="975" width="265" height="160" rx="14" fill="#dcebe3"/>
<text x="899" y="1014" fill="#285e50" font-size="23" font-weight="600"><tspan x="899" dy="0">Uygun ekibe hazırla</tspan></text>
<text x="899" y="1051" fill="#285e50" font-size="19" font-weight="400"><tspan x="899" dy="0">Uzmanlık veya üst grup</tspan><tspan x="899" dy="27.55">önerisini sun.</tspan></text>
<text x="899" y="1116" fill="#52645d" font-size="14" font-weight="400"><tspan x="899" dy="0">İnsan onaylar veya değiştirir.</tspan></text>
<rect x="415" y="1163" width="340" height="85" rx="14" fill="#f6e2da"/>
<text x="439" y="1202" fill="#a44934" font-size="23" font-weight="600"><tspan x="439" dy="0">İnsan uzmanı devreye al</tspan></text>
<text x="439" y="1239" fill="#a44934" font-size="19" font-weight="400"></text>
<text x="48" y="1240" fill="#52645d" font-size="16" font-weight="400"><tspan x="48" dy="0">Yeni kanıt, aynı güvenlik kontrolünden geçer.</tspan></text>
<text x="48" y="1274" fill="#52645d" font-size="17" font-weight="400"><tspan x="48" dy="0">Teşhis ve onarım uzmanın sorumluluğundadır. Kanıt maliyetleri MVP varsayımlarıdır.</tspan></text>
</g></svg>
